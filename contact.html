<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arlo Metzger | Contact</title>
    <!-- cdn font-awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="assets/css/main.css?v=20261006-4">
</head>
<body>
    <!-- Main Wrapper   -->
    <div class="main-wrapper">
        <div class="craft-home-container">
            <div class="row">
                <div class=" col-2 col-md-1 col-lg-3 ">
                    <!-- Sidebar Menu -->
                    {% include sidebar.html active="contact" toggle_id="mode-changer-contact" %}
                </div>
                <div class="col-10 col-md-11 col-lg-9">
                    <div class="main-bar">
                        <section class="contact">
                            <header class="page-heading contact-title">
                                <h1 class="page-title">Contact</h1>
                                <p>Have a question or project in mind? Send me a message.</p>
                            </header>
                        <div class="row">
                            <div class="col-12 col-lg-8">
                                <div class="contact-form">
                                    <form action="">
                                        <input type="text" name="" id="" placeholder="First Name">
                                        <input type="text" name="" id="" placeholder="Last Name">
                                        <input type="email" name="" id="" placeholder="Email">
                                        <input type="number" name="" id="" placeholder="Phone Number">
                                        <input type="text" name="" id="" placeholder="Subject">
                                        <textarea name="" id="" cols="30" rows="10" placeholder="Write us a message"></textarea>
                                        <div class="contact-form-btn">
                                            <a href="" class="btn_primary">Send Message</a>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </section>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/personal-info.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/mode-switcher.js"></script>
</body>
</html>
