<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-Card | Blog</title>
    <!-- cdn font-awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <!-- Main Wrapper   -->
    <div class="main-wrapper">
        <div class="craft-home-container">
            <div class="row">
                <div class="col-lg-3 col-md-1 col-2">
                    <!-- Sidebar Menu -->
                    {% include sidebar.html active="blog" toggle_id="mode-changer-blog" %}
                </div>
                <div class="col-lg-9 col-md-11 col-10">
                    <div class="main-bar">
                        <!-- Blog Section -->
                            <h2 class="page-title">Blogs</h2>
                            <div id="blog">
                                
                            </div>
                            <button id="load-more-btn">
                                Load More    
                            </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="assets/js/personal-info.js"></script>
    <script src="assets/js/blog.js"></script>
    <script src="assets/js/app.js"></script>
    <!-- mode switcher javascript code -->
    <script>
        var toggleIconBlog = document.getElementById('mode-changer-blog');

        toggleIconBlog.onclick= () =>{
            console.log("clicked");
            let local_storage_mode = localStorage.getItem('mode')
            console.log(local_storage_mode)
            if(local_storage_mode === 'dark'){
                localStorage.setItem('mode', 'light');
                document.body.classList.toggle("dark-theme");
            }else{
                localStorage.setItem('mode', 'dark');
                document.body.classList.toggle("dark-theme");
                console.log('else')
            }
            if (document.body.classList.contains("dark-theme")) {
                document.getElementById('moon-svg').style.display = "none"
                document.getElementById('sun-svg').style.display = "block"
                document.getElementById('mode-changer').style.background = "#434343"
            }else{
                document.getElementById('sun-svg').style.display = "none"
                document.getElementById('moon-svg').style.display = "block"
                document.getElementById('mode-changer').style.background = "#EDEDED"
            }
        };
        let local_storage_mode = localStorage.getItem('mode')
        if(local_storage_mode === 'dark'){
            document.body.classList.add("dark-theme");
            console.log('Hi Dark Theme')
        }else{
            document.body.classList.remove("dark-theme");
        }
        if (document.body.classList.contains("dark-theme")) {
                document.getElementById('moon-svg').style.display = "none"
                document.getElementById('sun-svg').style.display = "block"
                document.getElementById('mode-changer').style.background = "#434343"
            }else{
                document.getElementById('sun-svg').style.display = "none"
                document.getElementById('moon-svg').style.display = "block"
                document.getElementById('mode-changer').style.background = "#EDEDED"
            }
    </script>
</body>
</html>
