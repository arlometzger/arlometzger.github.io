<header class="sidebar">
    <div class="sidebar-profile">
        <div class="sidebar-profile__image">
            <img src="assets/images/img/sidebar-person.png" alt="">

                <img id="moon-svg" src="assets/images/icon/moon.svg" width="18" height="18" alt="">
                <img id="sun-svg" src="assets/images/icon/sun.svg" width="24" height="24" alt="">

            <ul>

                <li><a href="#" data-personal-social="linkedin"><i class="fa-brands fa-linkedin-in"></i></a></li>
                <li><a href="#" data-personal-social="pinterest"><i class="fa-brands fa-pinterest-p"></i></a></li>
                <li><a href="#" data-personal-social="twitter"><i class="fa-brands fa-twitter"></i></a></li>
                <li><a href="#" data-personal-phone-link><i class="fa-solid fa-phone"></i></a></li>
            </ul>
        </div>
    </div>
    <nav class="sidebar-menu">
        <ul>
            <li class="menu-item"><a href="index.html" class="{% if include.active == 'home' %}active{% endif %}"><i class="fa-solid fa-house"></i><span>Home</span></a></li>
            <li class="menu-item"><a href="portfolio.html" class="{% if include.active == 'portfolio' %}active{% endif %}"><i class="fa-solid fa-briefcase"></i><span>Portfolio</span></a></li>
            <li class="menu-item"><a href="resume.html" class="{% if include.active == 'resume' %}active{% endif %}"><i class="fa-solid fa-id-card-clip"></i><span>Resume</span></a></li>
            <li class="menu-item"><a href="blog.html" class="{% if include.active == 'blog' %}active{% endif %}"><i class="fa-brands fa-blogger-b"></i><span>Blog</span></a></li>
            <li class="menu-item"><a href="contact.html" class="{% if include.active == 'contact' %}active{% endif %}"><i class="fa-solid fa-table-list"></i><span>Contact</span></a></li>
        </ul>

    <div class="sidebar-contact">
        <p class="sidebar-contact__address">
            <i class="fa-solid fa-location-arrow"></i><span data-personal-location>Brooklyn, New York</span>
        </p>
        <p class="sidebar-contact__phone">
            <i class="fa-solid fa-phone"></i><span data-personal-phone>(718) 316-0360</span>
        </p>
        <p class="sidebar-contact__email">
            <i class="fa-regular fa-envelope"></i><span data-personal-email>arlometzger1@gmail.com</span>
        </p>
    </div>
