<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arlo Metzger | Resume</title>
    <!-- cdn font-awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/bootstrap-grid.min.css">
    <link rel="stylesheet" href="assets/css/main.css?v=20261006-5">
</head>
<body>
    <!-- Main Wrapper   -->
    <div class="main-wrapper">
        <div class="craft-home-container">
            <div class="row">
                <div class="col-2 col-md-1 col-lg-3">
                    <!-- Sidebar Menu -->
                    {% include sidebar.html active="resume" toggle_id="mode-changer-resume" %}
                </div>
                <div class=" col-10 col-md-11 col-lg-9">
                    <main class="main-bar resume-page">
                        <header class="page-heading resume-page__header">
                            <div>
                                <h1 class="page-title">Resume</h1>
                            </div>
                            <a class="btn_primary resume-download" href="#" hidden>
                                <i class="fa-solid fa-download" aria-hidden="true"></i> Download PDF
                            </a>
                        </header>
                        <section class="resume-section" aria-labelledby="resume-education-title">
                            <h2 id="resume-education-title">Education</h2>
                            <div class="resume-entries" id="resume-education"></div>
                        </section>
                        <section class="resume-section" aria-labelledby="resume-experience-title">
                            <h2 id="resume-experience-title">Experience</h2>
                            <div class="resume-entries" id="resume-experience"></div>
                        </section>
                        <section class="resume-section" aria-labelledby="resume-skills-title">
                            <h2 id="resume-skills-title">Skills</h2>
                            <ul class="resume-skills" id="resume-skills"></ul>
                        </section>
                    </main>
                </div>
            </div>
            
        </div>
    </div>

    <script src="assets/js/personal-info.js"></script>
    <script src="assets/js/resume-data.js"></script>
    <script src="assets/js/resume.js"></script>
    <script src="assets/js/mode-switcher.js"></script>
</body>
</html>
